name: CI

# Runs on every push and pull request: executes the project's test suite so
# broken code is caught before a merge, per the Rulebook's testing requirements.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install rich rdflib
          pip install pytest coverage

      - name: Run tests
        run: |
          if [ -f tests/README.md ] && [ "$(find tests -type f ! -name 'README.md' | wc -l)" -eq 0 ]; then
            echo "No test files yet under tests/ — add tests before the first real release."
            exit 0
          fi
          coverage run -m pytest tests/
          coverage report
